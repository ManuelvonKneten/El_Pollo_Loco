<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>El Pollo Loco</title>
    <script src="models/drawable-objects.class.js" defer></script>
    <script src="models/movable-object.class.js" defer></script>
    <script src="models/throwable-objects.class.js" defer></script>
    <script src="models/character.class.js" defer></script>
    <script src="models/chicken.class.js" defer></script>
    <script src="models/cloud.class.js" defer></script>
    <script src="models/coin.class.js" defer></script>
    <script src="models/bottle.class.js" defer></script>
    <script src="models/status-bar.class.js" defer></script>
    <script src="models/background-object.class.js" defer></script>
    <script src="models/endboss.class.js" defer></script>

    <script src="models/world.class.js" defer></script>
    <script src="models/level.class.js" defer></script>

    <script src="js/levels/level1.js" defer></script>

    <script src="models/keyboard.class.js" defer></script>

    <script src="js/sounds.js" defer></script>
    <script src="js/game.js" defer></script>
</head>
<body onload="init()">
    <h1>El Pollo Loco</h1>

    <div id="game_container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="start_screen" class="game_overlay">
            <img class="screen_background" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="">
            <div class="overlay_content">
                <h2>El Pollo Loco</h2>
                <button class="overlay_button" onclick="startGame()">Spiel starten</button>
                <button class="overlay_button mute_button" onclick="toggleMute()">🔊 Musik aus</button>
                <table class="controls_table">
                    <tr><td>&larr; / &rarr;</td><td>Nach links / rechts laufen</td></tr>
                    <tr><td>&uarr; / Leertaste</td><td>Springen</td></tr>
                    <tr><td>D</td><td>Flasche werfen</td></tr>
                    <tr><td>M</td><td>Musik / Sound ein- und ausschalten</td></tr>
                </table>
            </div>
        </div>

        <div id="game_over_screen" class="game_overlay d_none">
            <img class="screen_background" src="img/9_intro_outro_screens/game_over/game over.png" alt="">
            <div class="overlay_content">
                <button class="overlay_button" onclick="restartGame()">Erneut spielen</button>
                <button class="overlay_button" onclick="backToMenu()">Hauptmenü</button>
            </div>
        </div>

        <div id="win_screen" class="game_overlay d_none">
            <img class="screen_background" src="img/You won, you lost/You won A.png" alt="">
            <div class="overlay_content">
                <h2>DU HAST GEWONNEN!</h2>
                <p>Gesammelte Münzen: <span id="won_coins">0 / 0</span></p>
                <button class="overlay_button" onclick="restartGame()">Erneut spielen</button>
                <button class="overlay_button" onclick="backToMenu()">Hauptmenü</button>
            </div>
        </div>
    </div>
</body>
</html>
